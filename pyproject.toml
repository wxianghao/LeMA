[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lema"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Xianghao Wang", email = "wxianghao@outlook.com" }]
dependencies = [
    "loguru>=0.7.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.setuptools]
packages = ["lema"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
