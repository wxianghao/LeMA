[project]
name = "lema"
version = "0.1.0"
description = "LeMA: scalable Levenberg-Marquardt optimizer on multiple GPUs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nvidia-cupynumeric>=26.1.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.setuptools]
packages = ["lema"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
